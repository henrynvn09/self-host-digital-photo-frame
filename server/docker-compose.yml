services:
  photo-api:
    build:
      context: ./photo-api
    container_name: photo-api
    mem_limit: 2048m
    memswap_limit: 2048m
    # Match your Synology DSM user/group so DSM ACLs allow reading /photos:ro and writing /data.
    # Run `id <your-dsm-username>` via SSH on your NAS (commonly 1026:100 on Synology).
    user: "${PUID:-1026}:${PGID:-100}"
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PORT=2283
      - PHOTOS_DIR=/photos
      - DATA_DIR=/data
      - API_KEY=${API_KEY:-}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-30m}
      - EXCLUDE_PATTERNS=${EXCLUDE_PATTERNS:-}
      - MAX_WIDTH=${MAX_WIDTH:-2560}
      - MAX_HEIGHT=${MAX_HEIGHT:-2560}
      - JPEG_QUALITY=${JPEG_QUALITY:-88}
      - GOMEMLIMIT=1200MiB
      - CACHE_MODE=${CACHE_MODE:-memory}
      - CACHE_MAX_MB=${CACHE_MAX_MB:-1024}
      - MAX_CONCURRENT_DECODES=${MAX_CONCURRENT_DECODES:-2}
      - VIDEO_MAX_WIDTH=${VIDEO_MAX_WIDTH:-1920}
      - VIDEO_MAX_HEIGHT=${VIDEO_MAX_HEIGHT:-1080}
      - VIDEO_FPS=${VIDEO_FPS:-30}
      - MAX_CONCURRENT_VIDEO_TRANSCODES=${MAX_CONCURRENT_VIDEO_TRANSCODES:-1}
      - PREBAKE_BLUR=${PREBAKE_BLUR:-false}
      - FRAME_WIDTH=${FRAME_WIDTH:-1440}
      - FRAME_HEIGHT=${FRAME_HEIGHT:-2560}
    volumes:
      # Read-only mount: container can NEVER modify or delete your original Synology Photos
      - ${PHOTOS_PATH:-/volume1/photo}:/photos:ro
      # Writable mount: stores SQLite metadata index (preview cache runs in 1GB RAM)
      - ${DATA_PATH:-/volume1/docker/photoframe/data}:/data
    networks:
      - photoframe_net
    # photo-api is intentionally internal-only. Uncomment below only for LAN debugging:
    # ports:
    #   - "2283:2283"

  magicmirror:
    build:
      context: ./magicmirror
    container_name: magicmirror
    restart: unless-stopped
    depends_on:
      photo-api:
        condition: service_healthy
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - ./magicmirror/config:/opt/magic_mirror/config:ro
    ports:
      - "${MAGICMIRROR_PORT:-8036}:8080"
    networks:
      - photoframe_net

networks:
  photoframe_net:
    driver: bridge
